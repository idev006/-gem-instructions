name: activity-based-elementary-worksheet Gem SSOT

on:
  push:
    paths:
      - 'gems/activity-based-elementary-worksheet/**'
      - '.github/workflows/activity-based-elementary-worksheet-gem-ssot.yml'
  pull_request:
    paths:
      - 'gems/activity-based-elementary-worksheet/**'
      - '.github/workflows/activity-based-elementary-worksheet-gem-ssot.yml'
  workflow_dispatch:

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Gem SSOT
        run: python gems/activity-based-elementary-worksheet/tools/validate_ssot.py

      - name: Core dry-run suite — 449 cases
        run: python gems/activity-based-elementary-worksheet/tools/full_dry_run_suite.py

      - name: Declared-skill matrix — 360 cases
        run: python gems/activity-based-elementary-worksheet/tools/full_skill_matrix_suite.py

      - name: Runtime UAT regression — 12 cases
        run: python gems/activity-based-elementary-worksheet/tools/runtime_uat_regression_suite.py

      - name: Semantic oracle regression — 20 cases
        run: python gems/activity-based-elementary-worksheet/tools/semantic_oracle_regression_suite.py

      - name: System-wide quality regression — 30 cases
        run: python gems/activity-based-elementary-worksheet/tools/system_wide_quality_regression_suite.py

      - name: Scale-line integrity regression — 40 cases
        run: python gems/activity-based-elementary-worksheet/tools/scale_line_integrity_regression_suite.py

      - name: Instrument review + speedometer regression — 60 cases
        run: python gems/activity-based-elementary-worksheet/tools/instrument_review_speedometer_regression_suite.py

      - name: Protractor scale safety regression — 24 cases
        run: python gems/activity-based-elementary-worksheet/tools/protractor_scale_safety_regression_suite.py

      - name: Full metrology audit — 80 cases
        run: python gems/activity-based-elementary-worksheet/tools/metrology_full_audit_regression_suite.py

      - name: Actual weight-dial inactive-gap regression — 32 cases
        run: python gems/activity-based-elementary-worksheet/tools/weight_dial_inactive_gap_regression_suite.py

      - name: Physical page feasibility regression — 48 cases
        run: python gems/activity-based-elementary-worksheet/tools/physical_page_feasibility_regression_suite.py

      - name: Build compact installation package
        run: python gems/activity-based-elementary-worksheet/tools/build_install_package.py

      - name: Verify ZIP
        run: python -m zipfile -t gems/activity-based-elementary-worksheet/dist/activity-based-elementary-worksheet_Gem_v2.6.3_LTS_10WORKERS_TXT.zip

      - name: Upload installation artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-based-elementary-worksheet_Gem_v2.6.3_LTS_10WORKERS_TXT
          path: gems/activity-based-elementary-worksheet/dist/activity-based-elementary-worksheet_Gem_v2.6.3_LTS_10WORKERS_TXT.zip
          if-no-files-found: error
